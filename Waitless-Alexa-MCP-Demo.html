<body>
<main class="shell" aria-label="Waitless interactive prototype">
  <section id="alexa" class="screen">
    <header class="topbar"><div class="brand"><span class="orb"></span><span>Alexa+</span></div><div class="top-actions"><button id="traceBtn" class="pill"><span class="dot"></span>MCP</button><button id="resetBtn" class="icon-btn reset" aria-label="Restart demo">↻</button></div></header>
    <div class="demo-banner"><span><strong>Interactive demo</strong> · two sample cases</span><span>No real calls</span></div>
    <div id="chat" class="chat">
      <div id="hero" class="hero"><h1>What can I help<br>take care of?</h1><p>Ask naturally. Alexa can bring in compatible services when a task needs action.</p><div class="suggestions"><button class="suggestion" type="button" id="electricSuggestion">Start electricity at my new apartment<span>Original case · Lakeshore Energy</span></button><button id="startSuggestion" class="suggestion">Cancel my Costco membership<span>Use Waitless to handle the customer-service call</span></button></div></div>

  </section>

  <section id="companion" class="screen companion hidden">
    <header class="topbar"><button id="compBack" class="back" aria-label="Back">‹</button><div class="brand"><span class="wait-mark" style="width:31px;height:31px;border-radius:11px">W</span><span>Waitless</span></div><button id="compTrace" class="pill"><span class="dot"></span>MCP</button></header>

  <aside id="trace" class="trace hidden" aria-label="MCP request trace"><div class="trace-head"><h2>MCP request trace</h2><button id="closeTrace">Done</button></div><div id="traceMeta" class="trace-meta">Connecting…</div><div id="traceLog" class="trace-log"></div></aside>
</main>
<script>
  const $=s=>document.querySelector(s); const messages=$('#messages'); const chat=$('#chat');
  const FIELD_SCHEMA={
    name:{label:'Name',autocomplete:'name',type:'text'},
    phone_number:{label:'Phone number',autocomplete:'tel',type:'tel'},
    address:{label:'Address',autocomplete:'street-address',type:'text'},
    membership_last_four:{label:'Membership last four digits',autocomplete:'off',type:'text',inputmode:'numeric',maxlength:4}
  };
  const CASES={
    electricity:{id:'electric_service_demo',task:'WL-2048',provider:'Lakeshore Energy',mark:'LE',providerType:'Utility provider',request:'Start electricity at my new apartment on November 1.',goal:'Start electric service',detail:'Start date · November 1',fields:['name','phone_number','address'],context:{name:'Alex Morgan',phone_number:'(312) 555-0147',address:'1200 W Lake St, Apt 4B'},inquiry:'Ask to start electricity on November 1.',menu:'Selecting “Start or move service”',explain:'Explaining the November 1 request',approvalTitle:'Choose how to handle the deposit',approvalIntro:'The demo representative can take a refundable $120 deposit, or waive it with autopay. Choose what Waitless may request.',options:[{id:'deposit',title:'Pay a refundable $120 deposit',detail:'Keep autopay off. Any payment would be handled separately in a real flow.',action:'Approve deposit',message:'Use the refundable deposit.'},{id:'autopay',title:'Enroll in autopay · waive deposit',detail:'Authorize autopay enrollment. No payment method is connected in this demo.',action:'Approve autopay',message:'Use autopay and waive the deposit.'}],confirmation:'LE-48291',callback:true},
    costco:{id:'costco_membership_cancel_demo',task:'WL-2049',provider:'Costco',mark:'C',providerType:'Member services',request:'Cancel my Costco membership and ask about a membership-fee refund.',goal:'Cancel membership',detail:'Cancellation + refund inquiry',fields:['name','phone_number','membership_last_four'],context:{name:'Alex Morgan',phone_number:'(312) 555-0147',membership_last_four:'4821'},inquiry:'Ask about cancellation and a membership-fee refund.',menu:'Selecting membership services',explain:'Requesting cancellation and refund details',approvalTitle:'When should your membership end?',approvalIntro:'Canceling ends membership access. Turning off auto-renewal keeps it active for its current term. Any refund remains a request until confirmed.',options:[{id:'cancel_now',title:'Cancel membership now',detail:'End membership access and ask about a membership-fee refund.',action:'Approve cancellation',message:'Cancel my membership now and ask about a refund.'},{id:'stop_renewal',title:'Only turn off auto-renewal',detail:'Keep membership active for the current term. Don’t request a cancellation refund.',action:'Approve renewal change',message:'Keep my membership for now. Only turn off auto-renewal.'}],confirmation:'DEMO-CM-48291',callback:false}
  };
  const state={step:0,caseId:'electricity',task:'WL-2048',selected:null,profile:{name:'Alex Morgan',phone_number:'(312) 555-0147',address:'1200 W Lake St, Apt 4B',membership_last_four:'4821'},logs:[],transport:'checking',requestId:0};
  const currentCase=()=>CASES[state.caseId];
  function selectCase(id){state.caseId=id;state.task=CASES[id].task;state.selected=null}
  const maskedPhone=()=> '••• ••• '+state.profile.phone_number.replace(/\D/g,'').slice(-4);
  function fieldValue(key){return key==='phone_number'?maskedPhone():key==='membership_last_four'?'•••• '+state.profile[key]:state.profile[key]}
  function approvedOption(){return currentCase().options.find(option=>option.id===state.selected)}
  function caseOutcome(){if(state.caseId==='electricity')return {title:'Electric service scheduled',headline:'Starts November 1',detail:state.selected==='autopay'?'Deposit waived after the option you approved.':'Refundable $120 deposit selected. Payment is not collected in this demo.',statusLabel:'Deposit',status:state.selected==='autopay'?'Waived':'$120 · payment not collected',followup:'Check service on Nov 1'};return state.selected==='stop_renewal'?{title:'Auto-renewal turned off',headline:'Auto-renewal turned off',detail:'Your membership stays active for its current term.',statusLabel:'Refund',status:'Not requested',followup:'Membership remains active'}:{title:'Membership canceled',headline:'Membership canceled',detail:'Cancellation is complete. A membership-fee refund was requested.',statusLabel:'Refund',status:'Requested · not yet received',followup:'Track refund confirmation'}}

  const toolDefs=['prepare_task','save_task_context','start_assisted_call','get_call_status','answer_pending_choice','begin_identity_handoff','resume_assisted_call','get_case_result'];
  const localResult=(name,args={})=>({demo:true,task_id:state.task,scenario:currentCase().id,status:({prepare_task:'setup_required',save_task_context:'ready',start_assisted_call:'calling',get_call_status:'action_required',answer_pending_choice:'choice_recorded',begin_identity_handoff:'user_bridge_ringing',resume_assisted_call:currentCase().callback?'waiting_for_callback':'waiting_for_confirmation',get_case_result:'resolved'})[name]||'ok',...(name==='begin_identity_handoff'?{representative_connected:true,user_phone:maskedPhone(),ai_media:'disconnected',recording:false,transcription:false}:{}),...(name==='get_case_result'?{confirmation:currentCase().confirmation,approved_change:state.selected,outcome:caseOutcome().title,status_detail:caseOutcome().status}:{}),...(name==='answer_pending_choice'?{answer:args.answer}: {})});
  function log(kind,label,payload){state.logs.push({kind,label,payload,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})});renderTrace()}
  async function rpc(method,params={}){const id=++state.requestId,req={jsonrpc:'2.0',id,method,params};log('req',method,req);try{if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname))throw Error('static demo');const r=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json','mcp-protocol-version':'2025-11-25'},body:JSON.stringify(req)});if(!r.ok)throw Error('offline');const data=await r.json();state.transport='Streamable HTTP · connected';log('res',method,data);return data.result}catch(e){state.transport='Standalone demo transport';let result;if(method==='initialize')result={protocolVersion:'2025-11-25',serverInfo:{name:'waitless-demo',version:'0.1.0'}};else if(method==='tools/list')result={tools:toolDefs.map(name=>({name}))};else result={structuredContent:localResult(params.name,params.arguments)};const data={jsonrpc:'2.0',id,result};log('res',method,data);return result}}
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  let flowVersion=0;
  async function callTool(name,args={}){const version=flowVersion;const controls=[...document.querySelectorAll('#messages button,#compContent button,.send,#voiceBtn')].filter(b=>!b.disabled);controls.forEach(b=>b.disabled=true);const n=document.createElement('div');n.className='processing';n.setAttribute('role','status');n.innerHTML='<span class="spinner"></span><span>Waitless is working…</span>';const parent=$('#companion').classList.contains('hidden')?messages:$('#compContent');parent.append(n);chat.scrollTop=chat.scrollHeight;try{const [result]=await Promise.all([rpc('tools/call',{name,arguments:{...args,scenario:currentCase().id}}),pause(1300)]);if(version!==flowVersion)throw new DOMException('Demo restarted','AbortError');return result}finally{n.remove();controls.forEach(b=>{if(b.isConnected)b.disabled=false})}}
  function renderTrace(){$('#traceMeta').textContent=`Protocol 2025-11-25 · ${state.transport} · ${state.logs.length} events`;$('#traceLog').innerHTML=state.logs.map(x=>`<div class="log"><span class="${x.kind}">${x.kind==='req'?'→ request':'← response'} · ${x.time} · ${x.label}</span><pre>${escapeHtml(JSON.stringify(x.payload,null,2))}</pre></div>`).join('');}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function add(html){messages.insertAdjacentHTML('beforeend',html);setTimeout(()=>chat.scrollTop=chat.scrollHeight,20)}
  function user(text){add(`<div class="msg user"><div class="bubble">${text}</div></div>`)}
  function assistant(text){add(`<div class="msg assistant"><div class="bubble"><div class="assistant-label">Alexa+</div>${text}</div></div>`)}
  function card(inner,extra=''){add(`<div class="tool-card ${extra}">${inner}</div>`)}
  function waitHead(status='Waitless',badge='MCP tool'){return `<div class="tool-head"><span class="wait-mark">W</span><div><h3>${status}</h3><p>Customer-service calling capability</p></div><span class="status">${badge}</span></div>`}
  function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;$('.shell').append(n);setTimeout(()=>n.remove(),2500)}
  async function begin(text){if(state.step)return;state.step=1;$('#hero').classList.add('hidden');const c=currentCase();user(escapeHtml(text||c.request));await callTool('prepare_task',{task_id:state.task,goal:c.request,provider_hint:c.provider});assistant('I’ll ask <b>Waitless</b> to call '+escapeHtml(c.provider)+'. First, let’s check the details for this request.');card(waitHead(c.goal,'Details needed')+'<div class="summary"><div class="row"><span>Request</span><span>'+escapeHtml(c.detail)+'</span></div><div class="row"><span>Provider</span><span>'+escapeHtml(c.provider)+' · demo</span></div></div><div class="btns"><button class="primary" onclick="openSetup()">Review details</button></div>')}
  function showComp(html){cancelVoice();stopCallClock();$('#companion').classList.remove('in-call');$('#alexa').classList.add('hidden');$('#companion').classList.remove('hidden');$('#compContent').innerHTML=html;$('#compContent').scrollTop=0}
  function backAlexa(){stopCallClock();$('#companion').classList.remove('in-call');$('#companion').classList.add('hidden');$('#alexa').classList.remove('hidden');setTimeout(()=>chat.scrollTop=chat.scrollHeight,10)}
  window.openSetup=()=>{if(state.step>=2){toast('The call is already in progress.');return}const c=currentCase();showComp('<div class="eyebrow">Your details · '+escapeHtml(c.provider)+'</div><h1>Check your details</h1><p>These details help Waitless explain your request. You’ll handle any identity check directly.</p>'+c.fields.map(key=>{const f=FIELD_SCHEMA[key];return '<div class="field"><label for="field-'+key+'">'+f.label+'</label><input id="field-'+key+'" type="'+f.type+'" autocomplete="'+f.autocomplete+'" '+(f.inputmode?'inputmode="'+f.inputmode+'" ':'')+(f.maxlength?'maxlength="'+f.maxlength+'" ':'')+'value="'+escapeHtml(state.profile[key]||'')+'"></div>'}).join('')+'<div id="setupError" class="notice hidden" role="alert"></div><div class="notice">Use sample details in this demo. Starting the call authorizes an inquiry; you’ll approve any final change separately.</div><div class="sticky"><button class="primary" style="width:100%" onclick="saveSetup()">Continue</button></div>')};
  function callReview(){const c=currentCase();return '<div class="call-review"><div class="provider-line"><span class="provider-mark">'+c.mark+'</span><div class="provider-copy"><small>'+c.providerType+'</small><h3>'+c.provider+'</h3></div><span class="demo-chip">Demo</span></div><h2 class="call-task">'+c.goal+'</h2><div class="call-facts">'+c.fields.map(key=>'<div class="call-fact '+(key==='address'||key==='name'?'address':'')+'"><span>'+FIELD_SCHEMA[key].label+'</span><b>'+escapeHtml(fieldValue(key))+'</b></div>').join('')+'</div><div class="handoff-note">'+c.inquiry+' You’ll approve the final change before it proceeds.</div><div class="btns"><button class="secondary" onclick="openSetup()">Change details</button><button class="primary" onclick="startCall()">Start demo call</button></div></div>'}
  window.saveSetup=async()=>{const c=currentCase(),values={};for(const key of c.fields)values[key]=$('#field-'+key).value.trim();const invalid=c.fields.find(key=>!values[key]||(key==='phone_number'&&values[key].replace(/\D/g,'').length<7)||(key==='membership_last_four'&&!/^\d{4}$/.test(values[key])));if(invalid){$('#setupError').textContent='Please check '+FIELD_SCHEMA[invalid].label+'.';$('#setupError').classList.remove('hidden');$('#field-'+invalid).focus();return}Object.assign(state.profile,values);await callTool('save_task_context',{task_id:state.task,...values,scope:'request_information_only',demo:true});const existing=$('.precall-card');backAlexa();if(existing){existing.innerHTML=callReview();toast('Call details updated');return}assistant('Ready. Check who we’re calling and the request below.');card(callReview(),'precall-card')};
  window.startCall=async()=>{if(state.step>=2)return;state.step=2;const version=flowVersion,c=currentCase();await callTool('start_assisted_call',{task_id:state.task});document.querySelectorAll('.precall-card button').forEach(b=>b.disabled=true);assistant('Waitless is calling. You can leave—we’ll notify you when we need you.');card('','call-progress');const progress=$('.call-progress');const stages=[['Dialing '+c.provider,'Dialing','Opening the phone line'],['Navigating the phone menu','Connected',c.menu],['Waiting for a representative','On hold','Waitless is holding your place'],['Speaking with their agent','Connected',c.explain]];for(let i=0;i<stages.length;i++){if(version!==flowVersion)return;progress.innerHTML=waitHead(stages[i][0],stages[i][1])+'<div class="live-line"><i></i></div><div class="timeline">'+stages.slice(0,i+1).map((p,j)=>'<div class="event '+(j===i?'active':'done')+'"><span class="event-dot"></span><div><b>'+p[0]+'</b><p>'+p[2]+'</p></div></div>').join('')+'</div><div class="progress-caption">Simulated call · You don’t need to stay here.</div>';chat.scrollTop=chat.scrollHeight;await pause([1800,2200,2800,2400][i])}if(version===flowVersion)await needChoice()};
  window.needChoice=async()=>{await callTool('get_call_status',{task_id:state.task});card(waitHead('A decision needs you','Your approval')+'<div style="margin-top:14px;font-weight:740">'+currentCase().approvalTitle+'</div><p style="font-size:12px;color:var(--muted);line-height:1.5">'+currentCase().approvalIntro+'</p><div class="btns"><button class="primary" onclick="openChoice()">Review options</button></div>')};
  window.openChoice=()=>{const c=currentCase(),selected=approvedOption();showComp('<div class="eyebrow">Your approval · '+c.provider+'</div><h1>'+c.approvalTitle+'</h1><p>'+c.approvalIntro+'</p><div role="radiogroup" aria-label="Requested change">'+c.options.map(o=>'<button type="button" role="radio" aria-checked="'+(state.selected===o.id)+'" class="choice '+(state.selected===o.id?'selected':'')+'" onclick="pick(\''+o.id+'\')"><span class="radio"></span><div><b>'+o.title+'</b><p>'+o.detail+'</p></div></button>').join('')+'</div><div class="sticky"><button class="primary" style="width:100%" '+(selected?'':'disabled')+' onclick="sendChoice()">'+(selected?selected.action:'Choose an option')+'</button></div>')};
  window.pick=v=>{state.selected=v;openChoice()};
  window.sendChoice=async()=>{const option=approvedOption();if(!option)return;await callTool('answer_pending_choice',{task_id:state.task,choice_id:currentCase().id+'-decision',answer:state.selected});backAlexa();user(option.message);assistant('Got it. Waitless will continue with that choice.');card(waitHead('A quick identity check','Join the call')+'<p style="font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0">The representative needs to verify the account holder. They’re already on the line.</p><div class="btns"><button class="primary" onclick="openHandoff()">Take over securely</button></div>')};
  function icon(name){const paths={phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 1.9z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',grid:'<circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',speaker:'<path d="m11 5-6 4H2v6h3l6 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>'};return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths[name]+'</svg>'}
  window.openHandoff=async()=>{await callTool('begin_identity_handoff',{task_id:state.task,handoff_phone_last_four:state.profile.phone_number.replace(/\D/g,'').slice(-4)});showComp('<div class="handoff-v2"><div class="handoff-state"><span class="spinner"></span>Ready when you are</div><h1>Your representative<br>is on the line.</h1><p class="handoff-intro">Answer the call to verify your identity.<br>We’ve already handled the wait.</p><div class="connection-ticket"><div class="ticket-provider"><span class="provider-mark">'+currentCase().mark+'</span><div><b>'+currentCase().provider+'</b><span>'+currentCase().goal+'</span></div></div><div class="ticket-route"><span>Calling your phone</span><b>••• ••• '+escapeHtml(state.profile.phone_number.replace(/\D/g,'').slice(-4))+'</b></div><div class="ticket-status"><i></i>Representative holding for you</div></div><div class="privacy-note">'+icon('shield')+'<div><b>A private moment</b><p>AI listening, recording and transcription are off while you verify.</p></div></div><div class="handoff-actions"><button class="primary" onclick="answerBridge()">'+icon('phone')+'Answer demo call</button><p class="demo-footnote">Simulation · no real call or microphone</p></div></div>')};
  let callClock;function stopCallClock(){clearInterval(callClock)}
  window.answerBridge=()=>{stopCallClock();showComp('<div class="call-v2"><div class="call-topline"><span>'+icon('shield')+'Private call</span><span class="call-demo">DEMO</span></div><div class="call-identity"><div class="call-avatar-v2">'+currentCase().mark+'</div><h1>'+currentCase().provider+'</h1><p>Service representative</p><div class="call-duration" id="callDuration">00:00</div></div><div class="call-private"><i></i>Only you and the representative</div><div class="call-controls-v2"><button aria-label="Mute" aria-pressed="false" onclick="toggleCallControl(this)">'+icon('mic')+'<span>Mute</span></button><button aria-label="Keypad" aria-expanded="false" onclick="toggleKeypad(this)">'+icon('grid')+'<span>Keypad</span></button><button aria-label="Speaker" aria-pressed="false" onclick="toggleCallControl(this)">'+icon('speaker')+'<span>Speaker</span></button></div><div id="demoKeypad" class="demo-keypad hidden"><p>Demo keypad · don’t enter personal information</p><div>'+ '123456789*0#'.split('').map(n=>'<button onclick="demoTone()">'+n+'</button>').join('')+'</div></div><div class="call-bottom"><p>Finished verifying? Hand the call back to Waitless.</p><button class="primary" onclick="finishHandoff()">'+icon('arrow')+'Return to Waitless</button><button class="call-help" onclick="callHelp()">Need help?</button><span class="demo-footnote">Simulated audio · AI and recording off</span></div></div>');$('#companion').classList.add('in-call');let seconds=0;callClock=setInterval(()=>{const timer=$('#callDuration');if(!timer){stopCallClock();return}seconds++;timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)};
  window.toggleCallControl=button=>button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')==='true'?'false':'true');
  window.toggleKeypad=button=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));$('#demoKeypad').classList.toggle('hidden',!open)};
  window.demoTone=()=>toast('Demo tone · no data sent');
  window.callHelp=()=>toast('Demo: the representative is holding while you ask for help.');
  window.finishHandoff=async()=>{const version=flowVersion,c=currentCase();await callTool('resume_assisted_call',{task_id:state.task,verification_completed:true});backAlexa();if(c.callback){assistant('Waitless rejoined after verification and is waiting for the provider callback.');card(waitHead('Waiting for provider callback','In progress')+'<div class="summary"><div class="row"><span>Estimated provider wait</span><span>18–25 minutes · demo</span></div></div><div class="notice safe">You can leave. Waitless will resume when the fictional callback arrives.</div><div class="btns"><button class="primary" onclick="resolveCase()">Simulate callback</button></div>');return}assistant('You’re done. Waitless is collecting the confirmation for the change you approved.');card(waitHead('Getting written confirmation','In progress')+'<div class="live-line"><i></i></div><div class="notice safe">You can leave. The case will update when the demo confirmation arrives.</div>');await pause(2200);if(version===flowVersion)await resolveCase()};
  window.resolveCase=async()=>{await callTool('get_case_result',{task_id:state.task,approved_change:state.selected});const c=currentCase(),o=caseOutcome();assistant('The demo confirmation is here.');card(waitHead(o.title,'Confirmed · demo')+'<div class="result-hero"><div class="checkmark">✓</div><h2>'+o.headline+'</h2><p>'+o.detail+'</p></div><div class="summary"><div class="row"><span>Confirmation</span><span>'+c.confirmation+'</span></div><div class="row"><span>'+o.statusLabel+'</span><span>'+o.status+'</span></div><div class="row"><span>Follow-up</span><span>'+o.followup+'</span></div></div><div class="btns"><button class="primary" onclick="openResult()">View case history</button></div>')};
  window.openResult=()=>{const c=currentCase(),o=caseOutcome(),option=approvedOption();showComp('<div class="eyebrow">Case '+state.task+' · demo outcome</div><div class="result-hero"><div class="checkmark">✓</div><h2>'+o.title+'</h2><p>'+c.provider+' · '+c.confirmation+'</p></div><div class="evidence"><h3>Case history</h3><div class="timeline"><div class="event done"><span class="event-dot"></span><div><b>Your details reviewed</b><p>'+c.fields.map(key=>FIELD_SCHEMA[key].label).join(' · ')+'</p></div></div><div class="event done"><span class="event-dot"></span><div><b>'+option.title+' · approved by you</b><p>No change accepted before your decision</p></div></div><div class="event done"><span class="event-dot"></span><div><b>Identity check completed privately</b><p>No verification values captured</p></div></div><div class="event done"><span class="event-dot"></span><div><b>Demo confirmation received</b><p>'+c.confirmation+'</p></div></div></div></div><div class="notice safe" style="margin-top:14px">'+o.statusLabel+': '+o.status+'. This simulated case does not change a real account.</div><div class="sticky"><button class="primary" style="width:100%" onclick="backAlexa()">Back to Alexa+</button></div>')};
  function reset(){flowVersion++;state.step=0;state.selected=null;state.logs=[];state.requestId=0;messages.innerHTML='';$('.send').disabled=false;$('#hero').classList.remove('hidden');backAlexa();boot();}
  async function boot(){await rpc('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'alexa-plus-simulated-client',version:'0.1.0'}});await rpc('tools/list',{});renderTrace()}
  $('#electricSuggestion').onclick=()=>{selectCase('electricity');begin(currentCase().request)};
  $('#startSuggestion').onclick=()=>{selectCase('costco');begin(currentCase().request)};
  $('#composer').onsubmit=e=>{e.preventDefault();if(voiceSession)return;const v=$('#prompt').value.trim();if(v){if(state.step){toast('Restart the demo to create another task.');return}if(/costco|membership/i.test(v))selectCase('costco');else if(/electric|utility|power/i.test(v))selectCase('electricity');$('#prompt').value='';$('#voiceFeedback').classList.add('hidden');begin(v)}};
  $('#compBack').onclick=backAlexa;$('#resetBtn').onclick=reset;
  const showTrace=()=>$('#trace').classList.remove('hidden');$('#traceBtn').onclick=showTrace;$('#compTrace').onclick=showTrace;$('#closeTrace').onclick=()=>$('#trace').classList.add('hidden');
  for(const name of ["saveSetup","startCall","needChoice","sendChoice","openHandoff","finishHandoff","resolveCase"]){const action=window[name];window[name]=async(...args)=>{try{return await action(...args)}catch(error){if(error.name!=="AbortError")throw error}}}
  const beginAction=begin;begin=async(...args)=>{try{return await beginAction(...args)}catch(error){if(error.name!=="AbortError")throw error}};
  // Set an endpoint or supply transcribe(blob, {signal}) to enable real recording.
  window.WaitlessVoice={endpoint:null,transcribe:null,maxSeconds:60};
  let voiceSession=null,voiceSequence=0;
  function voiceFeedback(text){$('#voiceFeedback').textContent=text;$('#voiceFeedback').classList.remove('hidden')}
  function releaseVoice(session){clearInterval(session.clock);session.stream?.getTracks().forEach(t=>t.stop());if(session.recorder?.state==='recording'){session.recorder.ondataavailable=null;session.recorder.onstop=null;session.recorder.stop()}}
  function voiceIdle(){voiceSession=null;$('#voicePanel').classList.add('hidden');$('#voicePanel').classList.remove('transcribing');$('.composer-text').classList.remove('hidden');$('#voiceBtn').setAttribute('aria-expanded','false');$('#voiceDone').disabled=false;$('#prompt').focus()}
  function cancelVoice(){if(!voiceSession)return;const session=voiceSession;voiceSequence++;session.controller.abort();releaseVoice(session);voiceIdle()}
  async function startVoice(){if(voiceSession)return;const session={id:++voiceSequence,controller:new AbortController(),chunks:[],seconds:0,mode:(WaitlessVoice.endpoint||WaitlessVoice.transcribe)?'recording':'demo'};voiceSession=session;$('#voiceFeedback').classList.add('hidden');$('.composer-text').classList.add('hidden');$('#voicePanel').classList.remove('hidden');$('#voiceBtn').setAttribute('aria-expanded','true');$('#voiceTime').textContent='00:00';$('#voiceDone').disabled=true;$('#voiceLabel').textContent=session.mode==='demo'?'Demo voice input':'Connecting microphone…';$('#voiceHint').textContent=session.mode==='demo'?'Demo mode · no microphone is active':'Tap ✓ to transcribe, or × to discard.';
    try{if(session.mode!=='demo'){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Voice recording is unavailable in this browser. Please type your message.');session.stream=await navigator.mediaDevices.getUserMedia({audio:true});if(session.id!==voiceSequence){releaseVoice(session);return}const supported=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(type=>MediaRecorder.isTypeSupported(type));session.recorder=new MediaRecorder(session.stream,supported?{mimeType:supported}:{});session.recorder.ondataavailable=e=>{if(e.data.size)session.chunks.push(e.data)};session.recorder.onerror=()=>{if(voiceSession===session){cancelVoice();voiceFeedback('Recording stopped. Please try again or type your message.')}};session.recorder.start();$('#voiceLabel').textContent='Recording';}
      if(session.id!==voiceSequence)return;$('#voiceDone').disabled=false;session.clock=setInterval(()=>{session.seconds++;$('#voiceTime').textContent=String(Math.floor(session.seconds/60)).padStart(2,'0')+':'+String(session.seconds%60).padStart(2,'0');if(session.seconds>=WaitlessVoice.maxSeconds)finishVoice()},1000);
    }catch(error){if(session.id!==voiceSequence)return;releaseVoice(session);voiceIdle();voiceFeedback(error.name==='NotAllowedError'?'Microphone access was not allowed. You can still type your message.':error.name==='NotFoundError'?'No microphone found. You can still type your message.':error.message)}
  }
  async function finishVoice(){const session=voiceSession;if(!session||session.finishing)return;session.finishing=true;clearInterval(session.clock);$('#voiceDone').disabled=true;$('#voicePanel').classList.add('transcribing');$('#voiceLabel').textContent=session.mode==='demo'?'Preparing example…':'Transcribing…';let timeout;
    try{let text;if(session.mode==='demo'){await pause(1100);text=currentCase().request}
      else{const blob=await new Promise((resolve,reject)=>{session.recorder.onstop=()=>resolve(new Blob(session.chunks,{type:session.recorder.mimeType}));session.recorder.onerror=()=>reject(Error('Recording failed. Please try again.'));session.recorder.stop()});session.stream.getTracks().forEach(t=>t.stop());if(session.id!==voiceSequence)return;if(!blob.size)throw Error('No audio captured. Please try again.');timeout=setTimeout(()=>session.controller.abort(),30000);
        const transcribe=WaitlessVoice.transcribe||async function(audio,{signal}){const form=new FormData();const extension=audio.type.includes('mp4')?'m4a':'webm';form.append('audio',audio,'voice.'+extension);const response=await fetch(WaitlessVoice.endpoint,{method:'POST',body:form,signal});if(!response.ok)throw Error('Could not transcribe. Please try again.');return (await response.json()).text};
        text=await transcribe(blob,{signal:session.controller.signal});
      }
      if(session.id!==voiceSequence)return;if(typeof text!=='string'||!text.trim())throw Error('No speech recognized. Please try again.');const draft=$('#prompt').value.trim();$('#prompt').value=(draft?draft+' ':'')+text.trim();voiceIdle();voiceFeedback(session.mode==='demo'?'Example text inserted · edit it before sending.':'Review your transcript, then send.');
    }catch(error){if(session.id!==voiceSequence)return;voiceIdle();voiceFeedback(error.name==='AbortError'?'Transcription timed out. Please try again.':error.message)}finally{clearTimeout(timeout);releaseVoice(session)}
  }
  $('#voiceBtn').innerHTML=icon('mic');$('#voiceBtn').onclick=startVoice;$('#voiceCancel').onclick=cancelVoice;$('#voiceDone').onclick=finishVoice;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&voiceSession)cancelVoice()});
  window.addEventListener('pagehide',cancelVoice);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&voiceSession&&!voiceSession.finishing)cancelVoice()});
  const resetWithVoice=reset;reset=()=>{cancelVoice();$('#voiceFeedback').classList.add('hidden');resetWithVoice()};$('#resetBtn').onclick=reset;
  boot().then(()=>{const requested=new URLSearchParams(location.search).get('case');if(CASES[requested]){selectCase(requested);begin(currentCase().request)}});
</script>
</body>
