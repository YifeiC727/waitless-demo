# 引擎调参（tech §5.3）。结构由 waitless.models.EngineConfig 定义（冻结）；值的归属见 skeleton-notes。
# 不含端口、主机、路径、URL 或密钥。
version: 1
call: { idle_timeout_s: 1800 }
audio: { wire_sample_rate: 8000, pipeline_in_sample_rate: 16000 }    # S0 V5
vad: { threshold_dbfs: -45, frame_ms: 20 }
turns: { turn_end_silence_ms: 700, menu_end_silence_ms: 1200, transcript_grace_ms: 600 }  # S0-r2 V12：provider USER FINAL p95 575 ms
guard: { held_response_max_ms: 6000 }
# Sonic session continuation: leave this margin after a repeated tool result hold.
continuation_hold_margin_ms: 10000
dtmf: { tail_silence_ms: 200, user_mute_ms_per_key: 500 }              # pipecat 1.12.0 DTMF WAV: 4000 samples / 8000 Hz = 500 ms（20 ms 向上取整）
handoff:
  announce_idle_ms: 800
  resume_grace_ms: 3000
  token_ttl_s: 120
  join_timeout_s: 90
  rejoin_grace_s: 60
  confirm_attempts: 3
  confirm_timeout_s: 2
  notification_text: 有人接起了，请马上加入
  connected_text: 转接后线路上在跟你说话，请马上加入
  needs_user_text: 线路上的情况 Waitless 判断不了，请你接手
# v5.28：分档、连续上限与收尾预算均为必填严格正整数。
speaker:
  verdict_timeout_ms: 1000
  output_buffer_ms: 1200
  handoff_latency_max_ms: 1500
  clear_max_ms: 1000
  transit_max_ms: 100
  first_answer_silence_ms: 1000
  first_answer_no_voice_ms: 1500
  holder_audio_tail_ms: 1000
  uncertain_quiet_ms: 5000
  quiet_max_gap_ms: 200
  uncertain_max_wait_ms: 20000
  uncertain_max_turns: 3
  unavailable_max_attempts: 3
  teardown_step_timeout_ms: 5000
  teardown_cancel_grace_ms: 1000
  empty_continuation_ms: 3000
  guard_segment_quiet_ms: 600
  guard_noise_after_ms: 10000
web: { poll_ms: 1000 }
# pace_ms：网页演示时 run.sh 导出 WAITLESS_TEXTSIM_PACE_MS=1200 覆盖（A-20）；测试与评测保持 0。
# default_scenario：text-sim 未指定场景时用它；replay 一律用回放文件头的 scenario_id（A-11）。
textsim: { pace_ms: 0, default_scenario: baseline }
