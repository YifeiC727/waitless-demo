[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "waitless"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[aws-nova-sonic,websocket]==1.12.0",
  "mcp==2.3.0",
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "boto3==1.43.112",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "numpy==2.5.4"
]

[project.scripts]
waitless = "waitless.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not needs_keys and not needs_device and not needs_network\""
markers = [
  "needs_keys: needs real AWS / Jev credentials; run by the I lanes via scripts/load-keys-macos.sh",
  "needs_device: needs a real phone, browser or a user action",
  "needs_network: needs outbound network access",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
