[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "waitless"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[aws-nova-sonic,silero]>=1.12.0",
  "mcp>=2.3.0",
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "boto3>=1.43.112",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
  "numpy>=2.5.4"
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0"
]
