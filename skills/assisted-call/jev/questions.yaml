version: 1
default_task_goal: Help the user prepare, start, monitor, and finish an assisted call,
  with the user controlling consequential actions.
decision_points:
  assistant_next_action:
    when: each user message or MCP result
    questions:
      next_action:
        type: choice
        instructions: 'Pick the single next step of the assisted-call process: create
          a task card before any call; show the card and wait for the user''s own
          click to start; check status while a call runs; fetch the result after it
          ends.'
        criteria_from: tools_list
        extra_criteria:
          reply_only: Reply using the available tool results
          ask_clarify: Ask for missing task details
          present_task_card: Show the card and wait for a user click
          wait_for_call: Poll call status
  company_skill:
    when: prepare_task
    questions:
      company:
        type: choice
        instructions: Which company does the user want Waitless to call? Choose only
          among companies Waitless has a skill for.
        criteria_from: company_skills
        extra_criteria:
          none_of_the_above: No supported company matches
  task_intent:
    when: after company selection
    questions:
      intent:
        type: choice
        instructions: What does the user want done with this company?
        criteria_from: company_intents
        extra_criteria:
          none_of_the_above: None of the supported tasks matches
  precall_default:
    when: each pre-call question
    questions:
      precall:
        type: choice
        instructions: For this pre-call question, did the user's own words already
          choose an option, or ask to be asked?
        criteria_from: request_candidates
        extra_criteria:
          keep_default: Keep the configured default
          ask_user: Leave undecided and ask the user
