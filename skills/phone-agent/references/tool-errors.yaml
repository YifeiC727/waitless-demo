# phone-agent: one sentence of guidance per tool error code. Waitless adds the matching sentence to the failed tool's
# result as "hint", word for word; it decides nothing itself. Edit the wording here; codes not listed get no hint.
errors:
  choice_already_open: >-
    Your question is already on the account holder's screen. Do not ask it again. Wait for their answer; if the
    other side speaks to you meanwhile, tell them briefly that you are still checking with the account holder.
  interrupt_budget_exhausted: >-
    The account holder cannot be interrupted again on this call, so do not try again. If the company notes give a
    default for this choice, choose it and say it is the standard option; otherwise tell the other side that the
    account holder will follow up, then carry on with the rest of the task or end the call politely.
  handoff_already_active: >-
    The account holder is already being brought onto the call. Do not request it again; wait for the handoff to
    finish.
  jev_unavailable: >-
    Jev could not answer right now. Do not ask again for this; choose the more cautious option yourself.
  invalid_arguments: >-
    The tool did not accept these arguments. Check the tool description and call it once more with valid arguments,
    or carry on without it.
  call_ended: >-
    The call has already ended. Do nothing more.
