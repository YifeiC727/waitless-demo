instructions: >-
  Read the call so far and use the full context to decide who produced the most recent company line.
  Choose live_human only when the context clearly supports a live human representative speaking,
  considering the transfer or queue history and the interaction across turns.
  Phrases such as "thanks for holding" or "account holder" are not sufficient evidence on their own:
  recordings and virtual agents can use them too. Natural conversational wording or a personal name
  alone is also not sufficient. Recorded announcements and prompts remain menu_or_recording even
  when they imitate a receptionist. Choose hold for hold music or queue messages, and virtual_agent
  for an automated assistant asking questions or offering a transfer. Do not infer a human merely
  from an empty or unreliable transcript; assess the available context.
min_confidence: 0.7
options:
  menu_or_recording: A recorded menu, prompt or announcement.
  hold: Hold music or a hold or queue message.
  virtual_agent: An automated or virtual assistant.
  live_human: A live human representative.
