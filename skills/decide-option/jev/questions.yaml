version: 1
decision_points:
  call_round:
    when: each CompanyTurn
    questions:
      menu_choice:
        type: choice
        instructions_menu: The other side is an automated phone menu. Pick the option
          that best advances the task goal.
        instructions_conversation: >-
          Choose how Waitless should respond to the last company utterance (the
          final transcript line), given the task goal and rules. For greetings,
          hold or queue messages, and transfer notices choose wait, but if the
          greeting also asks how it can help or what the caller needs, choose
          open_answer. When a closing statement already gives a confirmation
          number, choose confirm_and_end.
        criteria_from: round_candidates
      call_phase:
        type: choice
        instructions: >-
          Which phase is the call in right now, judged by the last company utterance
          (the final transcript line)? Choose ivr_menu only when that utterance
          lists keypad options or asks the caller to press keys. A spoken greeting
          or an open question, such as asking how it can help, is ai_agent when it
          comes from an automated assistant and live_rep when it comes from a
          person. Menus earlier in the transcript do not make a later conversational
          utterance a menu.
        criteria:
          ivr_menu: An automated menu that lists keypad options or asks to press keys
          hold: Hold music or a wait message
          ai_agent: An automated virtual agent asking questions
          live_rep: A human representative speaking
          identity_check: Someone asking to verify the account holder's identity
          ended: The call has ended or the other side said goodbye
      needs_user:
        type: noul
        instructions: >-
          Does responding to the last company utterance (the final transcript
          line) require the account holder's own judgment or information only they
          may say (SSN, card number, date of birth)? Greetings, hold or queue messages,
          transfer notices, and completed closing statements require neither: no.
          An explicit request to bring the account holder onto the line requires
          them. Do not inherit a need for the user from the overall task or earlier
          verification.
      stakes:
        type: score
        instructions: >-
          Score only the consequences of a wrong Waitless response to the last
          company utterance (the final transcript line), not the risk of the overall
          task or earlier utterances. Greetings, hold or queue messages, transfer
          notices, information needing no reply, and closing statements that already
          give a confirmation number are 0. Responding to change a start date or
          address or accept new service terms is 2; amounts, deposits, fees, contracts,
          or autopay are 3. Score the response required now, not an account change
          merely reported as completed. If the last company utterance does not itself
          ask about money, a contract, or a change to the account, for example it only
          says it needs to collect details or verify the account, or it stops
          mid-sentence, score 0; topics that only Waitless mentioned earlier do not
          count as the company asking.
        criteria:
        - '0: no consequence'
        - '1: minor inconvenience'
        - '2: changes the account or service terms'
        - '3: involves money or a contract'
  said_as_decided:
    when: next ASSISTANT FINAL after injection
    questions:
      said:
        type: noul
        instructions: 'Waitless was instructed to convey: {decision_summary}. Did
          Waitless''s last utterance (last transcript line) convey that and add no
          other commitment?'
  call_outcome:
    when: after the call ends
    questions:
      outcome:
        type: choice
        instructions: The call has ended. Did the company complete the task goal and
          give a confirmation?
        criteria:
          confirmed: Task completed with confirmation
          needs_follow_up: The task still needs follow-up
          failed: The task failed
  result_item_kind:
    when: each extracted result statement
    questions:
      kind:
        type: choice
        instructions: Classify this statement the company made on the call.
        criteria:
          verified: A completed fact
          follow_up: A commitment needing follow-up
          drop: Unrelated to the task
