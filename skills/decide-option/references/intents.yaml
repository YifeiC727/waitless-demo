intents:
- id: open_answer
  description: Answer an open-ended question using authorized facts
  action: release
- id: decline_offer
  description: Decline surveys or marketing offers
  action: say
- id: state_ai_identity
  description: Truthfully disclose AI identity
  action: say
- id: request_handoff
  description: "Bring the account holder onto this same call: the company asks for the account holder to join or come on the line, or for verification only the account holder can give; not for a question about who is speaking"
  action: handoff
- id: ask_user
  description: Ask the account holder to decide
  action: ask_user
- id: confirm_and_end
  description: Close after task confirmation
  action: end
- id: ask_repeat
  description: Ask for repetition or clarification
  action: say
- id: wait
  description: Wait while holding or transferring
  action: wait
allowed_fields:
- name
- phone_number
- email
- address
- zip
- account_number
