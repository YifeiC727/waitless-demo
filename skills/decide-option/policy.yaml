version: 1
global:
  interrupt_budget: 1
  auto_answer:
    min_confidence: 0.85
  ask_user:
    only_if:
      min_stakes: 2
      max_confidence: 0.85
    max_options: 3
    timeout_sec: 20
    on_timeout: safe_default
  handoff_always:
  - ssn
  - card_number
  - date_of_birth
  never_claim_to_be_user: true
  learn_from_answers:
    enabled: true
    max_stakes: 1
decision_points:
  call_round:
    min_confidence: 0.85
    actions:
      open_answer: release
      decline_offer: say
      state_ai_identity: say
      request_handoff: handoff
      ask_user: ask_user
      confirm_and_end: end
      ask_repeat: say
      wait: wait
      press_field:*: press
      answer_precall:*: say
    consequential:
      min_stakes: 2
      needs_user_threshold: 0.5
      markers_from: lexicons.consequential
    menu:
      min_confidence: 0.85
      below_threshold: top_choice
      on_none: menu_safe_default
    conversation:
      min_confidence: 0.85
      below_threshold: top_choice
    order:
    - identity
    - forbidden_info
    - menu
    - consequential
    - standing_rules
    - preferences
    - confidence
    safe_defaults:
      menu_none: operator_or_repeat
      ask_user_timeout: decline_and_follow_up
      budget_exhausted: end_needs_follow_up
      handoff_not_live_rep: ask_for_representative
      press_field_refused: ask_repeat
      end_without_confirmation: ask_repeat_then_follow_up
  said_as_decided:
    min_probability: 0.7
    retries: 1
    on_fail: safe_default
    safe_default:
      action: end
      say_text: Thank you. The account holder will follow up. Goodbye.
    actions:
      said_ok: wait
      reinject: say
      safe_default: end
  call_outcome:
    min_confidence: 0.85
    confirmed_requires: confirmation_pattern
    below_threshold: needs_follow_up
    actions:
      '*': wait
  result_item_kind:
    min_confidence: 0.85
    below_threshold: follow_up
    actions:
      '*': wait
