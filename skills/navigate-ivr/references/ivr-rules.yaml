version: 1
press_patterns:
- (?P<label>(?:To|For)\s+[^.!?;]+?),?\s+press\s+(?P<digits>[0-9*#]+|zero|one|two|three|four|five|six|seven|eight|nine|star|pound|hash)
- press\s+(?P<digits>[0-9*#]+|zero|one|two|three|four|five|six|seven|eight|nine|star|pound|hash)\s+(?:for|to)\s+(?P<label>[^.!?;]+)
digit_words:
  zero: '0'
  one: '1'
  two: '2'
  three: '3'
  four: '4'
  five: '5'
  six: '6'
  seven: '7'
  eight: '8'
  nine: '9'
  star: '*'
  pound: '#'
  hash: '#'
operator: '0'
repeat: '9'
menu_safe_default: operator_or_repeat
