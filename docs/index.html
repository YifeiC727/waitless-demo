<body>
<main class="shell" aria-label="Waitless interactive prototype">
  <section id="alexa" class="screen">
    <header class="topbar"><div class="brand"><span class="orb"></span><span>Alexa+</span></div><div class="top-actions"><button id="traceBtn" class="pill"><span class="dot"></span>MCP</button><button id="resetBtn" class="icon-btn reset" aria-label="Restart demo">↻</button></div></header>
    <div class="demo-banner"><span><strong>Interactive demo</strong> · fictional company</span><span>No real calls</span></div>
    <div id="chat" class="chat">
      <div id="hero" class="hero"><h1>What can I help<br>take care of?</h1><p>Ask naturally. Alexa can bring in compatible services when a task needs action.</p><div class="suggestions"><button id="startSuggestion" class="suggestion">Start electricity at my new apartment<span>Use Waitless to handle the customer-service call</span></button><button class="suggestion" disabled>Check a promised refund<span>Another example of a persistent case</span></button></div></div>
      <div id="messages"></div>
    </div>
    <form id="composer" class="composer"><span style="padding-left:6px;color:#777">＋</span><input id="prompt" aria-label="Message Alexa" placeholder="Message Alexa+" value=""><button class="send" aria-label="Send">↑</button></form>
  </section>

  <section id="companion" class="screen companion hidden">
    <header class="topbar"><button id="compBack" class="back" aria-label="Back">‹</button><div class="brand"><span class="wait-mark" style="width:31px;height:31px;border-radius:11px">W</span><span>Waitless</span></div><button id="compTrace" class="pill"><span class="dot"></span>MCP</button></header>
    <div id="compContent" class="comp-body"></div>
  </section>

  <aside id="trace" class="trace hidden" aria-label="MCP request trace"><div class="trace-head"><h2>MCP request trace</h2><button id="closeTrace">Done</button></div><div id="traceMeta" class="trace-meta">Connecting…</div><div id="traceLog" class="trace-log"></div></aside>
</main>
<script>
  const $=s=>document.querySelector(s); const messages=$('#messages'); const chat=$('#chat');
  const state={step:0,task:'WL-2048',selected:'autopay',logs:[],transport:'checking',requestId:0};
  const toolDefs=['prepare_task','save_task_context','start_assisted_call','get_call_status','answer_pending_choice','begin_identity_handoff','resume_assisted_call','get_case_result'];
  const localResult=(name,args={})=>({demo:true,task_id:state.task,status:({prepare_task:'setup_required',save_task_context:'ready',start_assisted_call:'calling',get_call_status:'action_required',answer_pending_choice:'choice_recorded',begin_identity_handoff:'user_bridge_ringing',resume_assisted_call:'waiting_for_callback',get_case_result:'resolved'})[name]||'ok',...(name==='begin_identity_handoff'?{representative_connected:true,user_phone:'***-***-0147',ai_media:'disconnected',recording:false,transcription:false}:{}),...(name==='get_case_result'?{confirmation:'LE-48291',start_date:'November 1',deposit:'waived'}:{}),...(name==='answer_pending_choice'?{answer:args.answer}: {})});
  function log(kind,label,payload){state.logs.push({kind,label,payload,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})});renderTrace()}
  async function rpc(method,params={}){const id=++state.requestId,req={jsonrpc:'2.0',id,method,params};log('req',method,req);try{if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname))throw Error('static demo');const r=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json','mcp-protocol-version':'2025-11-25'},body:JSON.stringify(req)});if(!r.ok)throw Error('offline');const data=await r.json();state.transport='Streamable HTTP · connected';log('res',method,data);return data.result}catch(e){state.transport='Standalone demo transport';let result;if(method==='initialize')result={protocolVersion:'2025-11-25',serverInfo:{name:'waitless-demo',version:'0.1.0'}};else if(method==='tools/list')result={tools:toolDefs.map(name=>({name}))};else result={structuredContent:localResult(params.name,params.arguments)};const data={jsonrpc:'2.0',id,result};log('res',method,data);return result}}
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  let flowVersion=0;
  async function callTool(name,args={}){const version=flowVersion;const controls=[...document.querySelectorAll('#messages button,#compContent button,.send')].filter(b=>!b.disabled);controls.forEach(b=>b.disabled=true);const n=document.createElement('div');n.className='processing';n.setAttribute('role','status');n.innerHTML='<span class="spinner"></span><span>Waitless is working…</span>';const parent=$('#companion').classList.contains('hidden')?messages:$('#compContent');parent.append(n);chat.scrollTop=chat.scrollHeight;try{const [result]=await Promise.all([rpc('tools/call',{name,arguments:args}),pause(1300)]);if(version!==flowVersion)throw new DOMException('Demo restarted','AbortError');return result}finally{n.remove();controls.forEach(b=>{if(b.isConnected)b.disabled=false})}}
  function renderTrace(){$('#traceMeta').textContent=`Protocol 2025-11-25 · ${state.transport} · ${state.logs.length} events`;$('#traceLog').innerHTML=state.logs.map(x=>`<div class="log"><span class="${x.kind}">${x.kind==='req'?'→ request':'← response'} · ${x.time} · ${x.label}</span><pre>${escapeHtml(JSON.stringify(x.payload,null,2))}</pre></div>`).join('');}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function add(html){messages.insertAdjacentHTML('beforeend',html);setTimeout(()=>chat.scrollTop=chat.scrollHeight,20)}
  function user(text){add(`<div class="msg user"><div class="bubble">${text}</div></div>`)}
  function assistant(text){add(`<div class="msg assistant"><div class="bubble"><div class="assistant-label">Alexa+</div>${text}</div></div>`)}
  function card(inner,extra=''){add(`<div class="tool-card ${extra}">${inner}</div>`)}
  function waitHead(status='Waitless',badge='MCP tool'){return `<div class="tool-head"><span class="wait-mark">W</span><div><h3>${status}</h3><p>Customer-service calling capability</p></div><span class="status">${badge}</span></div>`}
  function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;$('.shell').append(n);setTimeout(()=>n.remove(),2500)}
  async function begin(text){if(state.step)return;state.step=1;$('#hero').classList.add('hidden');user(escapeHtml(text||'Start electricity at my new apartment on November 1.'));await callTool('prepare_task',{goal:'Start electricity at my new apartment on November 1',provider_hint:'Lakeshore Energy'});assistant('I can use <b>Waitless</b> to prepare the request and handle the service call. I’ll first check what it needs.');card(`${waitHead('Waitless needs a few details','Setup required')}<div class="summary"><div class="row"><span>Goal</span><span>Start electric service</span></div><div class="row"><span>Start date</span><span>November 1</span></div><div class="row"><span>Provider</span><span>Lakeshore Energy · fictional</span></div></div><div class="notice">Only information needed for this task will be collected. Passwords, verification codes and financial credentials are never requested here.</div><div class="btns"><button class="primary" onclick="openSetup()">Review securely</button></div>`)}
  function showComp(html){stopCallClock();$('#companion').classList.remove('in-call');$('#alexa').classList.add('hidden');$('#companion').classList.remove('hidden');$('#compContent').innerHTML=html;$('#compContent').scrollTop=0}
  function backAlexa(){stopCallClock();$('#companion').classList.remove('in-call');$('#companion').classList.add('hidden');$('#alexa').classList.remove('hidden');setTimeout(()=>chat.scrollTop=chat.scrollHeight,10)}
  window.openSetup=()=>showComp(`<div class="eyebrow">One-time setup · task scoped</div><h1>Give Waitless just enough to help</h1><p>This information is used for the Lakeshore Energy demo task. Sensitive verification stays between you and the service representative.</p><div class="field"><label>PHONE FOR SECURE HANDOFF</label><input id="phone" value="(312) 555-0147"></div><div class="field"><label>SERVICE ADDRESS</label><input id="address" value="1200 W Lake St, Apt 4B"></div><label class="check"><input id="consent" type="checkbox" checked><span>I authorize Waitless to describe this task, navigate the phone menu, wait on hold, and share the address above. Ask me before any charge, contract, or account change.</span></label><div class="notice safe">Never collected: password, PIN, OTP, SSN, date of birth, or card number.</div><div class="sticky"><button class="primary" style="width:100%" onclick="saveSetup()">Save and review plan</button></div>`);
  function callReview(){return `<div class="call-review"><div class="provider-line"><span class="provider-mark">LE</span><div class="provider-copy"><small>Utility provider</small><h3>Lakeshore Energy</h3></div><span class="demo-chip">Fictional</span></div><h2 class="call-task">Start electric service</h2><div class="call-facts"><div class="call-fact"><span>Start date</span><b>November 1</b></div><div class="call-fact"><span>Contact</span><b>••• ••• 0147</b></div><div class="call-fact address"><span>Service address</span><b>1200 W Lake St, Apt 4B</b></div></div><div class="handoff-note">You can leave after the call starts. Waitless will notify you only if a decision or identity check needs you.</div><div class="btns"><button class="secondary" onclick="openSetup()">Change details</button><button class="primary" onclick="startCall()">Start demo call</button></div></div>`}
  window.saveSetup=async()=>{await callTool('save_task_context',{task_id:state.task,verified_phone:'demo:+13125550147',service_address:'1200 W Lake St, Apt 4B',consent:true});const existing=$('.precall-card');backAlexa();if(existing){existing.innerHTML=callReview();toast('Call details updated');return}assistant('Everything looks right. Waitless is ready to call Lakeshore Energy.');card(callReview(),'precall-card') };
  window.startCall=async()=>{if(state.step>=2)return;state.step=2;const version=flowVersion;await callTool('start_assisted_call',{task_id:state.task});document.querySelectorAll('.precall-card button').forEach(b=>b.disabled=true);assistant('Waitless is calling. You can leave—we’ll notify you when we need you.');card('','call-progress');const progress=$('.call-progress');const stages=[['Dialing Lakeshore Energy','Dialing','Opening the phone line'],['Navigating the phone menu','Connected','Selecting “Start or move service”'],['Waiting for a representative','On hold','Waitless is holding your place'],['Speaking with their agent','Connected','Explaining the November 1 request']];for(let i=0;i<stages.length;i++){if(version!==flowVersion)return;progress.innerHTML=waitHead(stages[i][0],stages[i][1])+'<div class="live-line"><i></i></div><div class="timeline">'+stages.slice(0,i+1).map((p,j)=>'<div class="event '+(j===i?'active':'done')+'"><span class="event-dot"></span><div><b>'+p[0]+'</b><p>'+p[2]+'</p></div></div>').join('')+'</div><div class="progress-caption">Simulated call · You don’t need to stay here.</div>';chat.scrollTop=chat.scrollHeight;await pause([1800,2200,2800,2400][i])}if(version===flowVersion)await needChoice()};
  window.needChoice=async()=>{await callTool('get_call_status',{task_id:state.task});card(`${waitHead('A decision needs you','Action required')}<div style="margin-top:14px;font-weight:740">Deposit or autopay?</div><p style="font-size:12px;color:var(--muted);line-height:1.45">The provider can take a refundable $120 deposit, or waive it if you enroll in autopay. Waitless paused because money and account permissions are involved.</p><div class="btns"><button class="primary" onclick="openChoice()">Review options</button></div>`)};
  window.openChoice=()=>showComp(`<div class="eyebrow">Approval requested</div><h1>Choose how to handle the deposit</h1><p>The fictional provider is holding. Waitless will send only the option you approve.</p><div class="choice ${state.selected==='deposit'?'selected':''}" onclick="pick('deposit')"><span class="radio"></span><div><b>Pay a refundable $120 deposit</b><p>No access to your bank account. Payment would happen separately in a real service flow.</p></div></div><div class="choice ${state.selected==='autopay'?'selected':''}" onclick="pick('autopay')"><span class="radio"></span><div><b>Enroll in autopay · waive deposit</b><p>Requires explicit approval. This demo does not connect a payment method.</p></div></div><label class="check"><input type="checkbox"><span>Remember this preference for future utility calls</span></label><div class="sticky"><button class="primary" style="width:100%" onclick="sendChoice()">Approve selected option</button></div>`);
  window.pick=v=>{state.selected=v;openChoice()};
  window.sendChoice=async()=>{await callTool('answer_pending_choice',{task_id:state.task,choice_id:'deposit-policy',answer:state.selected});backAlexa();user(state.selected==='autopay'?'Use autopay and waive the deposit.':'Use the refundable deposit.');assistant('Approved. Waitless sent only that decision and continued.');card(`${waitHead('Identity check requested','Take over')}<p style="font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0">Their agent needs to verify the account holder. Waitless cannot hear, record, or transcribe this part.</p><div class="btns"><button class="primary" onclick="openHandoff()">Take over securely</button></div>`)};
  function icon(name){const paths={phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 1.9z"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',grid:'<circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',speaker:'<path d="m11 5-6 4H2v6h3l6 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>'};return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths[name]+'</svg>'}
  window.openHandoff=async()=>{await callTool('begin_identity_handoff',{task_id:state.task});showComp('<div class="handoff-v2"><div class="handoff-state"><span class="spinner"></span>Ready when you are</div><h1>Your representative<br>is on the line.</h1><p class="handoff-intro">Answer the call to verify your identity.<br>We’ve already handled the wait.</p><div class="connection-ticket"><div class="ticket-provider"><span class="provider-mark">LE</span><div><b>Lakeshore Energy</b><span>Start electric service · Nov 1</span></div></div><div class="ticket-route"><span>Calling your phone</span><b>••• ••• 0147</b></div><div class="ticket-status"><i></i>Representative holding for you</div></div><div class="privacy-note">'+icon('shield')+'<div><b>A private moment</b><p>AI listening, recording and transcription are off while you verify.</p></div></div><div class="handoff-actions"><button class="primary" onclick="answerBridge()">'+icon('phone')+'Answer demo call</button><p class="demo-footnote">Simulation · no real call or microphone</p></div></div>')};
  let callClock;function stopCallClock(){clearInterval(callClock)}
  window.answerBridge=()=>{stopCallClock();showComp('<div class="call-v2"><div class="call-topline"><span>'+icon('shield')+'Private call</span><span class="call-demo">DEMO</span></div><div class="call-identity"><div class="call-avatar-v2">LE</div><h1>Lakeshore Energy</h1><p>Service representative</p><div class="call-duration" id="callDuration">00:00</div></div><div class="call-private"><i></i>Only you and the representative</div><div class="call-controls-v2"><button aria-label="Mute" aria-pressed="false" onclick="toggleCallControl(this)">'+icon('mic')+'<span>Mute</span></button><button aria-label="Keypad" aria-expanded="false" onclick="toggleKeypad(this)">'+icon('grid')+'<span>Keypad</span></button><button aria-label="Speaker" aria-pressed="false" onclick="toggleCallControl(this)">'+icon('speaker')+'<span>Speaker</span></button></div><div id="demoKeypad" class="demo-keypad hidden"><p>Demo keypad · don’t enter personal information</p><div>'+ '123456789*0#'.split('').map(n=>'<button onclick="demoTone()">'+n+'</button>').join('')+'</div></div><div class="call-bottom"><p>Finished verifying? Hand the call back to Waitless.</p><button class="primary" onclick="finishHandoff()">'+icon('arrow')+'Return to Waitless</button><button class="call-help" onclick="callHelp()">Need help?</button><span class="demo-footnote">Simulated audio · AI and recording off</span></div></div>');$('#companion').classList.add('in-call');let seconds=0;callClock=setInterval(()=>{const timer=$('#callDuration');if(!timer){stopCallClock();return}seconds++;timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)};
  window.toggleCallControl=button=>button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')==='true'?'false':'true');
  window.toggleKeypad=button=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));$('#demoKeypad').classList.toggle('hidden',!open)};
  window.demoTone=()=>toast('Demo tone · no data sent');
  window.callHelp=()=>toast('Demo: the representative is holding while you ask for help.');
  window.finishHandoff=async()=>{await callTool('resume_assisted_call',{task_id:state.task,verification_completed:true});backAlexa();assistant('Waitless rejoined after verification. The provider has placed the request in a callback queue, so nothing will ring on your phone.');card(`${waitHead('Waiting for provider callback','In progress')}<div class="summary"><div class="row"><span>Your time involved</span><span>34 seconds</span></div><div class="row"><span>Estimated provider wait</span><span>18–25 minutes</span></div><div class="row"><span>AI media while waiting</span><span>Off</span></div></div><div class="notice safe">You can leave. Waitless will resume from the case context when the fictional callback arrives.</div><div class="btns"><button class="primary" onclick="resolveCase()">Simulate callback</button></div>`)};
  window.resolveCase=async()=>{await callTool('get_case_result',{task_id:state.task});assistant('All set—the service request is confirmed.');card(`${waitHead('Electric service scheduled','Resolved')}<div class="result-hero"><div class="checkmark">✓</div><h2>Starts November 1</h2><p>Deposit waived after the option you approved.</p></div><div class="summary"><div class="row"><span>Confirmation</span><span>LE-48291</span></div><div class="row"><span>Provider</span><span>Lakeshore Energy · fictional</span></div><div class="row"><span>Follow-up</span><span>Check service on Nov 1</span></div></div><div class="btns"><button class="primary" onclick="openResult()">View case history</button></div>`)};
  window.openResult=()=>showComp(`<div class="eyebrow">Case WL-2048 · resolved</div><div class="result-hero"><div class="checkmark">✓</div><h2>Electric service scheduled</h2><p>November 1 · confirmation LE-48291</p></div><div class="evidence"><h3>Case history</h3><div class="timeline"><div class="event done"><span class="event-dot"></span><div><b>Task authorized</b><p>Address shared; consequential changes locked</p></div></div><div class="event done"><span class="event-dot"></span><div><b>Autopay option approved by you</b><p>Demo only; no payment method connected</p></div></div><div class="event done"><span class="event-dot"></span><div><b>Identity verified during secure handoff</b><p>No sensitive value stored</p></div></div><div class="event done"><span class="event-dot"></span><div><b>Provider callback completed</b><p>Confirmation LE-48291 captured</p></div></div></div></div><div class="notice safe" style="margin-top:14px">Outcome evidence is a simulated confirmation, not proof of a real service change.</div><div class="sticky"><button class="primary" style="width:100%" onclick="backAlexa()">Back to Alexa+</button></div>`);
  function reset(){flowVersion++;state.step=0;state.selected='autopay';state.logs=[];state.requestId=0;messages.innerHTML='';$('.send').disabled=false;$('#hero').classList.remove('hidden');backAlexa();boot();}
  async function boot(){await rpc('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'alexa-plus-simulated-client',version:'0.1.0'}});await rpc('tools/list',{});renderTrace()}
  $('#startSuggestion').onclick=()=>begin('Start electricity at my new apartment on November 1.');
  $('#composer').onsubmit=e=>{e.preventDefault();const v=$('#prompt').value.trim();if(v){$('#prompt').value='';begin(v)}};
  $('#compBack').onclick=backAlexa;$('#resetBtn').onclick=reset;
  const showTrace=()=>$('#trace').classList.remove('hidden');$('#traceBtn').onclick=showTrace;$('#compTrace').onclick=showTrace;$('#closeTrace').onclick=()=>$('#trace').classList.add('hidden');
  for(const name of ["saveSetup","startCall","needChoice","sendChoice","openHandoff","finishHandoff","resolveCase"]){const action=window[name];window[name]=async(...args)=>{try{return await action(...args)}catch(error){if(error.name!=="AbortError")throw error}}}
  const beginAction=begin;begin=async(...args)=>{try{return await beginAction(...args)}catch(error){if(error.name!=="AbortError")throw error}};
  boot();
</script>
</body>
