scenario_id: baseline
company_id: bluefin-harbor-bank
max_call_seconds: 400
steps:
  greeting:
    kind: prompt
    text: Thank you for calling Bluefin Harbor Bank card services. This is a simulated line.
    next: main_menu
  main_menu:
    kind: menu
    text: For account balances, press 1. For card charges and statements, press 2. To report a lost or stolen card, press 3. To repeat this menu, press 9.
    options: {"1": dead_end, "2": card_menu, "3": dead_end, "9": main_menu}
  card_menu:
    kind: menu
    text: To ask about a charge on your statement, press 1. To make a payment, press 2. For rewards, press 3.
    options: {"1": connect, "2": dead_end, "3": dead_end}
  connect:
    kind: hold
    text: Please hold while we connect you to the card assistant.
    seconds: 3
    next: agent
  agent:
    kind: ai_agent
    scripted: {reply_end_silence_ms: 1500}
    persona: You are the virtual card assistant on a simulated bank line. Confirm the caller's name and the phone number on the account, identify the charge by merchant, date and amount, then send the case to the card specialist queue.
    collects: [name, phone_number, merchant, charge_date_amount]
    on_done: {specialist_queue: queue_notice}
    text_script:
      - say: I can help with a question about a charge. Please tell me the full name on the account.
        expect: {intent: open_answer}
      - say: Thank you. Please say the phone number on the account.
        expect: {intent: open_answer}
      - say: Which charge are you calling about? Please tell me the merchant name.
        expect: {intent: open_answer}
      - say: What were the date and the amount of that charge?
        expect: {intent: open_answer}
      - say: Thank you. Possible duplicate charges are reviewed by a card specialist. I will transfer you now.
        expect: {intent: wait}
  queue_notice:
    kind: prompt
    text: All card specialists are helping other customers. Please stay on the line. Calls are answered in the order received.
    next: queue
  queue:
    kind: hold
    seconds: 180
    next: rep
  rep:
    kind: live_rep
    scripted: {reply_end_silence_ms: 1500, polly_voice: Matthew}
    persona: You are a card specialist on a simulated bank line. Apologize that all specialists are busy, offer a callback instead of more waiting, and give a reference number.
    actions:
      - {do: offer, tag: callback}
      - {do: confirm, confirmation_format: "BH-{5d}"}
    text_script:
      - say: Thank you for holding. I am sorry, all of our specialists are still busy. Instead of waiting longer, we can have a specialist call the account holder back. Would you like a callback?
        expect: {intent: ask_user}
      - say: That is fine, I will wait while you decide. Should we call back at the phone number on the account?
        expect: {intent: open_answer}
      - say: "Thank you, I have noted your answer on the case. Your reference number for this charge review is {confirmation_number}. Thank you for calling. Goodbye."
        expect: {intent: confirm_and_end, outcome: needs_follow_up}
expected:
  menu_digits: ["2", "1"]
  interrupts: 1
  outcome: needs_follow_up
  confirmation_pattern: '^BH-\d{5}$'
